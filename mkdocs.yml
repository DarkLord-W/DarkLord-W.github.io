site_name: DarkLord-W's Blog
site_url: https://darklord-w.github.io/
site_description: 安全研究笔记与个人项目 —— CTF、靶场、Pwn、内网渗透
repo_url: https://github.com/DarkLord-W/DarkLord-W.github.io
repo_name: DarkLord-W/DarkLord-W.github.io
edit_uri: edit/main/docs/
copyright: © 2026 Darklord · Built with MkDocs Material

theme:
  name: material
  language: zh
  font: false                     # 关掉 Google Fonts，改用 extra.css 里的系统中文栈
  logo: assets/logo.png
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: 切换到浅色
  features:
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.superfences
  - toc:
      permalink: false

plugins:
  - search:
      lang:
        - zh
        - en
  - glightbox:
      touchNavigation: true
      effect: zoom
      width: 90%
      height: auto

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/image-fallback.js
